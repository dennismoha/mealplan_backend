  /meal-types/details/{id}/summary:
    get:
      tags: [calculations]
      summary: Per-serving dish or combination nutrition, ingredient weights and cost
      description: Uses gram weights and serving yields. Missing quantities, nutrition and prices are explicitly reported; currencies are never combined.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Calculated totals with completeness flags and missing-data lists
        '404':
          description: Meal or plan not found

  /meal/meal-plan/{id}/summary:
    get:
      tags: [calculations]
      summary: Daily and weekly totals, shopping list and grouped currency estimates
      description: Uses scheduled plan portions, component overrides, gram weights and serving yields. Shopping rows include recorded price date, source and location; price_warnings identify undated prices or prices older than 30 days. Missing quantities, nutrition and prices are explicitly reported; currencies are never combined.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Calculated totals with completeness flags and missing-data lists
        '404':
          description: Meal or plan not found

  /food/fooditems/{id}/nutrition:
    put:
      tags: [food-items]
      summary: Enter or update food nutrition and price (administrator)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Nutrients are for serving_size_g; price is always per 100 grams. Null means unknown, zero is a known zero. Saving a non-null price requires price_checked_at, price_source and price_location. Omitted fields are preserved; nutrition edits do not refresh the price date.
              properties:
                serving_size_g:
                  type: number
                  nullable: true
                energy_kcal:
                  type: number
                  nullable: true
                protein_g:
                  type: number
                  nullable: true
                carbohydrates_g:
                  type: number
                  nullable: true
                fat_g:
                  type: number
                  nullable: true
                fiber_g:
                  type: number
                  nullable: true
                price_per_100g:
                  type: number
                  nullable: true
                price_checked_at:
                  type: string
                  format: date
                  nullable: true
                  description: Date the price was checked, today or earlier.
                price_source:
                  type: string
                  maxLength: 255
                price_location:
                  type: string
                  maxLength: 150
                currency:
                  type: string
                  example: KES
                source:
                  type: string
      responses:
        '200':
          description: Nutrition and price saved
        '400':
          description: Invalid numeric values or currency
        '403':
          description: Administrator access required
        '404':
          description: Food item not found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: One-hour access token returned by registration, login, or refresh.
    refreshCookie:
      type: apiKey
      in: cookie
      name: jwt
      description: HTTP-only seven-day refresh-token cookie managed by the server.
  parameters:
    CountryId:
      name: id
      in: path
      required: true
      description: Numeric country identifier
      schema:
        type: integer
  responses:
    Unauthorized:
      description: Missing or invalid access token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
    Forbidden:
      description: The signed-in user does not have the required role or ownership
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
    LinkCreated:
      description: Relationship created
      content:
        application/json:
          schema:
            type: object
            required: [success]
            properties:
              success:
                type: boolean
                example: true
  schemas:
    Message:
      type: object
      properties:
        message:
          type: string
    User:
      type: object
      required: [id, email, role, status]
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        role:
          type: string
          enum: [user, professional, admin]
        status:
          type: string
          enum: [active, revoked]
        createdAt:
          type: string
          format: date-time
          nullable: true
    Session:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
          description: Bearer access token
        user:
          $ref: '#/components/schemas/User'
    LoginRequest:
      type: object
      required: [userEmail, password]
      properties:
        userEmail:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 6
    RegisterRequest:
      allOf:
        - $ref: '#/components/schemas/LoginRequest'
        - type: object
          required: [confirm_password]
          properties:
            confirm_password:
              type: string
              format: password
              minLength: 6
    AdminCreateUserRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 6
        role:
          type: string
          enum: [user, professional, admin]
          default: user
    UpdateUserAccessRequest:
      type: object
      minProperties: 1
      properties:
        role:
          type: string
          enum: [user, professional, admin]
        status:
          type: string
          enum: [active, revoked]
    CountryInput:
      type: object
      required: [name, code]
      properties:
        name:
          type: string
          example: Kenya
        code:
          type: string
          minLength: 2
          maxLength: 3
          example: KEN
        description:
          type: string
          nullable: true
        image_url:
          type: string
          format: uri
          nullable: true
    Country:
      allOf:
        - $ref: '#/components/schemas/CountryInput'
        - type: object
          required: [id]
          properties:
            id:
              type: integer
            created_at:
              type: string
              format: date-time
              nullable: true
            updated_at:
              type: string
              format: date-time
              nullable: true
    Nutrition:
      type: object
      properties:
        serving_size_g:
          type: number
          format: double
        energy_kcal:
          type: number
          format: double
        protein_g:
          type: number
          format: double
        carbohydrates_g:
          type: number
          format: double
        fat_g:
          type: number
          format: double
        fiber_g:
          type: number
          format: double
        source:
          type: string
          nullable: true
    FoodLocalName:
      type: object
      required: [country_id, name, scope]
      properties:
        pronunciation_audio:
          type: string
          writeOnly: true
          description: Optional base64 audio data URL for this specific name.
        pronunciation_url:
          type: string
          nullable: true
          readOnly: true
          description: Playback URL of this name's pronunciation.
        country_id:
          type: integer
          minimum: 1
          description: ID of an existing country.
        name:
          type: string
          maxLength: 255
        scope:
          type: string
          enum: [countrywide, tribal, official_language]
        tribe_name:
          type: string
          maxLength: 100
          description: Required for tribal names; empty or omitted otherwise.
        language_name:
          type: string
          maxLength: 100
          description: Required for official_language names; empty or omitted otherwise.
        country:
          type: object
          readOnly: true
          description: Country details included in food item responses.
    CatalogFoodItem:
      type: object
      properties:
        idFoodItems:
          type: integer
        food_itemID:
          type: string
          format: uuid
        food_name:
          type: string
          description: Legacy alias for english_name
        english_name:
          type: string
        local_names:
          type: array
          items:
            $ref: '#/components/schemas/FoodLocalName'
        local_name:
          type: string
          nullable: true
        descriptionl:
          type: string
          nullable: true
        image_url:
          type: string
          format: uri
          nullable: true
        category_id:
          type: string
          format: uuid
          nullable: true
        foodsubcategory_id:
          type: string
          format: uuid
        countries:
          type: array
          items:
            $ref: '#/components/schemas/Country'
        nutrition:
          allOf:
            - $ref: '#/components/schemas/Nutrition'
          nullable: true
    MealType:
      type: object
      properties:
        idtable1:
          type: integer
        mealTypesID:
          type: string
          format: uuid
        meal_name:
          type: string
        image_url:
          type: string
          format: uri
          nullable: true
        countries:
          type: array
          items:
            $ref: '#/components/schemas/Country'
    RecipeFoodLink:
      type: object
      required: [id]
      properties:
        id:
          type: string
          format: uuid
          description: Food item UUID
        quantity:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
    RecipeInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
        description:
          type: string
