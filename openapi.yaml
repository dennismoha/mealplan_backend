    PlanPortions:
      type: object
      description: Keys are breakfast, morning_break, lunch, evening_break and supper. Omitted slots default to one serving. Send the full portions object when editing. Portion instructions are descriptive only. Components override dish servings within a combination and multiply the slot serving quantity.
      additionalProperties:
        type: object
        required: [servings]
        properties:
          servings:
            type: number
            minimum: 0.01
            maximum: 1000
          instructions:
            type: string
            maxLength: 500
          components:
            type: object
            additionalProperties:
              type: number
              minimum: 0.01
              maximum: 1000
      example:
        breakfast:
          servings: 6
          instructions: Six eggs when the recipe yields one egg per serving.
